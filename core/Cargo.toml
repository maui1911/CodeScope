[package]
name = "codescope-core"
version = "0.0.1"
edition = "2024"
publish = false
description = "Shared models for CodeScope: settings, themes, env-aware paths. UI-free so it can be used from CLI tools and tests."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow.workspace = true
uuid.workspace = true
# `ureq` powers the GitHub release poll in `update_check`. Picked over
# `reqwest` because it's blocking (so it composes cleanly with
# `cx.background_spawn` from app.rs), has no tokio runtime requirement,
# and rolls up to ~1/4 the compile-time of `reqwest`. The `tls` feature
# (ureq 2.x's name for the rustls backend, see `ureq/src/tls.rs`) reuses
# the rustls already in our dep tree (pulled by gpui), avoiding a
# second TLS implementation.
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
# `K32GetProcessMemoryInfo` for the dev-only memory watchdog. Mirrors
# the version pinned by the binary crate's `Cargo.toml` so we're not
# pulling two copies of `windows` into the workspace.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
