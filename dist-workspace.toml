[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist / axodotdev).
#
# Scope notes for CodeScope:
#
# - cargo-dist builds the release binary on native runners per target
#   (`macos-14`, `macos-15-intel`, `ubuntu-22.04`) and packages each
#   as a `.tar.gz`. Windows packaging is handled by a custom workflow
#   job that uses Inno Setup — see `.github/workflows/release.yml`'s
#   `windows-package` job and `installer/CodeScope.iss`. cargo-dist
#   does NOT package Windows here (its MSI flow was retired together
#   with the auto-update rip in #244; the new self_update flow uses
#   atomic exe-swap which is incompatible with MSI component tracking).
#
# - Linux runtime deps (gpui needs wayland + x11 + xkbcommon +
#   fontconfig + freetype) are installed in the GH Actions Linux
#   job via apt before `dist build` runs.
[dist]
cargo-dist-version = "0.31.0"
ci = "github"
# No cargo-dist-managed installers. Windows ships via Inno Setup
# (see release.yml); macOS / Linux ship as tar.gz archives directly.
installers = []
# macOS + Linux only. The Windows target is built by the
# `windows-package` job in release.yml using Inno Setup, not by
# cargo-dist's matrix.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
hosting = "github"
# Don't let cargo-dist inject axoupdater. Auto-update is handled
# in-app via self_update + a manual-apply toast (see core/src/
# update_check.rs and src/update.rs); axoupdater would duplicate
# that path.
install-updater = false
source-tarball = false
allow-dirty = ["ci"]
pr-run-mode = "skip"
# Archive format for unix targets. Default is `.tar.xz`, but
# `self_update` 0.41 has no xz/lzma feature — it only supports
# `compression-flate2` (gzip), `compression-zip-bzip2`, and
# `compression-zip-deflate`. Switching to `.tar.gz` lets the in-app
# updater on Linux extract the same artifact that fresh installs use.
# macOS archive format changes too as a side effect; mac uses
# notifier-only (browser fallback) for in-app updates so it doesn't
# extract programmatically.
unix-archive = ".tar.gz"

[dist.dependencies.apt]
libwayland-dev = "*"
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libfontconfig1-dev = "*"
libfreetype6-dev = "*"
libxcb1-dev = "*"
libxcb-render0-dev = "*"
libxcb-shape0-dev = "*"
libxcb-xfixes0-dev = "*"
libssl-dev = "*"
pkg-config = "*"
