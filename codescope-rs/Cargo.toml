[workspace]
members = ["core", "terminal"]
exclude = ["vendor/gpui-terminal"]

[package]
name = "codescope-rs-spike"
version = "0.0.1"
edition = "2024"
publish = false
description = "Spike: gpui window with one embedded terminal running pwsh."
build = "build.rs"

[[bin]]
name = "spike"
path = "src/main.rs"

[[bin]]
name = "window"
path = "src/window.rs"

[[example]]
name = "ptytest"
path = "examples/ptytest.rs"

[dependencies]
gpui = "0.2.2"
gpui-terminal = { path = "vendor/gpui-terminal" }
codescope-terminal = { path = "terminal" }
codescope-core = { path = "core" }
portable-pty = "0.9"
anyhow = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.build-dependencies]
# Embed `assets/codescope.ico` as the Windows resource icon for the
# `window` binary so File Explorer / taskbar / Alt-Tab show the same
# brand mark as the C# build's `ApplicationIcon`. Used only by
# `build.rs` on Windows hosts; non-Windows targets skip the resource
# step entirely.
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
