[package]
name = "codescope-core"
version = "0.0.1"
edition = "2024"
publish = false
description = "Shared models for CodeScope: settings, themes, env-aware paths. UI-free so it can be used from CLI tools and tests."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
